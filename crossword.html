<style>
/* ============ شبكة — الكلمات المتقاطعة ============ */
:root {
  --bg: #0f172a;
  --bg2: #131f38;
  --card: #1b2740;
  --card2: #223251;
  --line: #2c3d5e;
  --text: #eef2f9;
  --soft: #93a4c0;
  --brand: #22c55e;
  --brand2: #0ea5e9;
  --gold: #fbbf24;
  --danger: #ef4444;
  --cell: 38px;
  --radius: 16px;
}
[data-theme="light"] {
  --bg: #eef2f7; --bg2: #f6f8fb; --card: #ffffff; --card2: #eef2f7;
  --line: #d9e0ea; --text: #16233a; --soft: #6b7b95;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Noto Kufi Arabic", "Tahoma", system-ui, sans-serif;
  min-height: 100vh;
  overscroll-behavior-y: contain;
}
#app { max-width: 620px; margin: 0 auto; padding: 14px 12px 28px; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
.hidden { display: none !important; }

/* ---------- الشريط العلوي ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 4px 16px;
}
.logo {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
  background: linear-gradient(150deg, var(--brand), var(--brand2));
  box-shadow: 0 8px 20px rgba(34, 197, 94, .25); flex: 0 0 auto;
}
.logo svg { width: 24px; height: 24px; fill: #fff; }
.logo-text h1 { font-size: 18px; margin: 0; letter-spacing: -.3px; }
.logo-text p { margin: 1px 0 0; font-size: 11.5px; color: var(--soft); }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--line);
  padding: 8px 12px; border-radius: 999px; font-size: 13px; font-weight: 700;
}
.chip .num { color: var(--gold); font-variant-numeric: tabular-nums; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--line); font-size: 17px;
}
.icon-btn:active { transform: scale(.95); }

/* ---------- إحصاءات ---------- */
.stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
}
.stat {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 10px; text-align: center;
}
.stat b { display: block; font-size: 19px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--soft); }

/* ---------- بطاقات المجموعات ---------- */
.section-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 0 2px 10px; font-size: 14px; color: var(--soft);
}
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cat {
  position: relative; overflow: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; text-align: start; transition: transform .12s, border-color .12s;
}
.cat:active { transform: scale(.98); }
.cat .glow {
  position: absolute; inset-inline-end: -30px; top: -30px; width: 90px; height: 90px;
  border-radius: 50%; opacity: .18; filter: blur(2px);
}
.cat-icon {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  font-size: 21px; margin-bottom: 10px; background: var(--card2);
}
.cat h3 { margin: 0 0 8px; font-size: 14.5px; }
.bar { height: 6px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand2)); border-radius: 99px; }
.cat-meta { display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; color: var(--soft); }

/* ---------- الصفحات ---------- */
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.level {
  aspect-ratio: 1; border-radius: 14px; background: var(--card); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 16px; font-weight: 800;
}
.level.solved { background: linear-gradient(160deg, rgba(34,197,94,.22), rgba(14,165,233,.14)); border-color: rgba(34,197,94,.45); }
.level .stars { font-size: 9px; letter-spacing: 1px; color: var(--gold); }

/* ---------- اللعب ---------- */
.game-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.crumb { font-size: 13px; color: var(--soft); flex: 1; }
.crumb b { color: var(--text); }

.clue {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
}
.clue-badge {
  flex: 0 0 auto; min-width: 44px; text-align: center; padding: 6px 8px; border-radius: 10px;
  background: linear-gradient(150deg, var(--brand), var(--brand2)); color: #052e16;
  font-weight: 800; font-size: 12.5px; line-height: 1.3;
}
.clue-text { flex: 1; font-size: 14.5px; line-height: 1.6; }
.clue-nav { display: flex; gap: 6px; }
.clue-nav button {
  width: 30px; height: 30px; border-radius: 9px; background: var(--card2); font-size: 14px;
}

.grid-wrap { display: flex; justify-content: center; margin: 6px 0 14px; }
.grid {
  display: grid; gap: 2px; direction: ltr;
  background: var(--card); padding: 6px; border-radius: 14px; border: 1px solid var(--line);
}
.cell {
  width: var(--cell); height: var(--cell); border-radius: 6px;
  background: var(--card2); position: relative; display: grid; place-items: center;
  font-size: calc(var(--cell) * .52); font-weight: 700; color: var(--text);
  transition: background .1s, box-shadow .1s; user-select: none;
}
.cell.blank { background: transparent; }
.cell.filled { background: #2b3d61; }
[data-theme="light"] .cell.filled { background: #dbe6f5; }
.cell.in-word { background: #3a5488; }
[data-theme="light"] .cell.in-word { background: #c4d8f2; }
.cell.active {
  background: linear-gradient(150deg, var(--brand), var(--brand2));
  color: #04231a; box-shadow: 0 0 0 2px rgba(34,197,94,.45);
}
.cell.wrong { color: #fff; background: var(--danger); }
.cell.revealed { color: var(--gold); }
.cell .n {
  position: absolute; top: 1px; right: 2px; font-size: calc(var(--cell) * .27);
  color: var(--soft); font-weight: 700;
}
.cell.active .n { color: #04231a; opacity: .8; }
.cell.cross::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
}
.shake { animation: shake .3s; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

/* ---------- الأدوات ---------- */
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tool {
  background: var(--card); border: 1px solid var(--line); border-radius: 13px;
  padding: 10px 6px; text-align: center; font-size: 12px; line-height: 1.5;
}
.tool .ico { display: block; font-size: 17px; margin-bottom: 2px; }
.tool .cost { color: var(--gold); font-weight: 700; font-size: 11px; }
.tool:disabled { opacity: .45; }
.tool:active:not(:disabled) { transform: scale(.97); }

/* ---------- لوحة المفاتيح ---------- */
.kb { display: grid; gap: 6px; }
.kb-row { display: flex; gap: 5px; justify-content: center; }
.key {
  flex: 1 1 0; min-width: 0; height: 42px; border-radius: 9px;
  background: var(--card); border: 1px solid var(--line);
  font-size: 16px; font-weight: 700; display: grid; place-items: center;
}
.key:active { background: var(--card2); }
.key.wide { flex: 2 1 0; font-size: 13px; }
.key.alt { font-size: 14px; color: var(--soft); }

/* ---------- النافذة ---------- */
.backdrop {
  position: fixed; inset: 0; background: rgba(6, 12, 24, .72);
  display: grid; place-items: center; padding: 18px; z-index: 50; animation: fade .16s;
}
@keyframes fade { from { opacity: 0; } }
.modal {
  width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; padding: 22px; text-align: center; animation: pop .22s;
}
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.97); } }
.modal .big { font-size: 42px; margin-bottom: 6px; }
.modal h2 { margin: 0 0 6px; font-size: 19px; }
.modal p { margin: 0 0 16px; font-size: 13.5px; color: var(--soft); line-height: 1.8; }
.modal .stars-row { font-size: 28px; letter-spacing: 4px; margin: 6px 0 12px; color: var(--gold); }
.modal .reward { font-size: 15px; margin-bottom: 16px; }
.modal .reward b { color: var(--gold); font-size: 20px; }
.modal-actions { display: grid; gap: 8px; }
.btn {
  padding: 13px; border-radius: 12px; font-weight: 800; font-size: 14.5px; text-align: center;
}
.btn.primary { background: linear-gradient(150deg, var(--brand), var(--brand2)); color: #04231a; }
.btn.soft { background: var(--card2); color: var(--text); }

/* ---------- تنبيه ---------- */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(30px);
  background: #0b1424; color: #fff; padding: 11px 18px; border-radius: 12px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: .25s; z-index: 90;
  border: 1px solid #24344f; max-width: 90vw; text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 360px) {
  .cats { grid-template-columns: 1fr; }
  .levels { grid-template-columns: repeat(3, 1fr); }
}

</style>

<script>
/* مولّد شبكات الكلمات المتقاطعة العربية — حتمي (نفس البذرة = نفس الشبكة) */
'use strict';

/* ---------- أدوات عامة ---------- */
function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function mulberry32(a) {
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** توحيد الحروف لمقارنة إجابات اللاعب (أ/إ/آ -> ا، ة -> ه، ى -> ي …) */
function normalizeArabic(str) {
  return String(str || '')
    .replace(/[\u064B-\u0652\u0670\u0640\u200f\u200e]/g, '')
    .replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي')
    .replace(/ئ/g, 'ي')
    .replace(/ؤ/g, 'و')
    .replace(/ة/g, 'ه')
    .replace(/\s+/g, '')
    .trim();
}

/* ---------- بناء شبكة واحدة ---------- */
function buildOnce(pool, rnd, target) {
  const map = new Map(); // "r,c" -> { r, c, letter, h, v }
  const entries = [];
  const key = (r, c) => r + ',' + c;
  const at = (r, c) => map.get(key(r, c));

  function canPlace(answer, r, c, dir) {
    const dr = dir === 'down' ? 1 : 0;
    const dc = dir === 'across' ? -1 : 0; // الأفقي يُقرأ من اليمين لليسار

    // لا امتداد قبل بداية الكلمة ولا بعد نهايتها
    if (at(r - dr, c - dc)) return -1;
    if (at(r + dr * answer.length, c + dc * answer.length)) return -1;

    let intersections = 0;
    for (let i = 0; i < answer.length; i++) {
      const rr = r + dr * i;
      const cc = c + dc * i;
      const cell = at(rr, cc);
      if (cell) {
        if (cell.letter !== answer[i]) return -1;
        if (dir === 'across' && cell.h) return -1; // كلمتان أفقيتان لا تتقاطعان
        if (dir === 'down' && cell.v) return -1;
        intersections++;
      } else {
        // الجيران العموديون/الأفقيون في غير التقاطع يجب أن يكونوا فارغين
        if (dir === 'across') {
          if (at(rr - 1, cc) || at(rr + 1, cc)) return -1;
        } else {
          if (at(rr, cc - 1) || at(rr, cc + 1)) return -1;
        }
      }
    }
    return intersections;
  }

  function place(word, r, c, dir) {
    const dr = dir === 'down' ? 1 : 0;
    const dc = dir === 'across' ? -1 : 0;
    for (let i = 0; i < word.answer.length; i++) {
      const rr = r + dr * i;
      const cc = c + dc * i;
      const existing = at(rr, cc);
      if (existing) existing[dir === 'across' ? 'h' : 'v'] = true;
      else map.set(key(rr, cc), { r: rr, c: cc, letter: word.answer[i], h: dir === 'across', v: dir === 'down' });
    }
    entries.push({ answer: word.answer, clue: word.clue, row: r, col: c, dir });
  }

  /** كلفة توسيع مساحة الشبكة عند وضع الكلمة (لتشجيع الشبكات المتراصّة) */
  function expansion(r, c, dir, len, b) {
    const endR = dir === 'down' ? r + len - 1 : r;
    const endC = dir === 'across' ? c - len + 1 : c;
    const minR = Math.min(b.minR, r), maxR = Math.max(b.maxR, endR);
    const minC = Math.min(b.minC, endC), maxC = Math.max(b.maxC, c);
    return (maxR - minR + maxC - minC) - b.size;
  }

  if (!pool.length) return { entries };

  // الكلمة الأولى في الوسط
  const first = pool[0];
  place(first, 0, 0, 'across');

  function bounds() {
    let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
    for (const c of map.values()) {
      if (c.r < minR) minR = c.r;
      if (c.r > maxR) maxR = c.r;
      if (c.c < minC) minC = c.c;
      if (c.c > maxC) maxC = c.c;
    }
    return { minR, maxR, minC, maxC, size: maxR - minR + maxC - minC };
  }

  function bestPlacement(word) {
    let best = null;
    const b = bounds();
    for (const cell of map.values()) {
      for (let i = 0; i < word.answer.length; i++) {
        if (cell.letter !== word.answer[i]) continue;

        // محاولة أفقية: الخلية (cell.r, cell.c) تمثل الحرف i => بداية الكلمة يمينًا
        const acr = { r: cell.r, c: cell.c + i };
        const scoreH = canPlace(word.answer, acr.r, acr.c, 'across');
        if (scoreH >= 1) {
          const s = scoreH * 10 - expansion(acr.r, acr.c, 'across', word.answer.length, b);
          if (!best || s > best.score) best = { dir: 'across', r: acr.r, c: acr.c, score: s };
        }

        // محاولة عمودية
        const down = { r: cell.r - i, c: cell.c };
        const scoreV = canPlace(word.answer, down.r, down.c, 'down');
        if (scoreV >= 1) {
          const s = scoreV * 10 - expansion(down.r, down.c, 'down', word.answer.length, b);
          if (!best || s > best.score) best = { dir: 'down', r: down.r, c: down.c, score: s };
        }
      }
    }
    return best;
  }

  // إدراج جشع: في كل خطوة نختار الكلمة التي تتقاطع أكثر
  let remaining = pool.slice(1);
  while (entries.length < target && remaining.length) {
    let chosen = null;
    for (const word of remaining) {
      const cand = bestPlacement(word);
      if (cand && (!chosen || cand.score > chosen.cand.score)) chosen = { word, cand };
    }
    if (!chosen) break;
    place(chosen.word, chosen.cand.r, chosen.cand.c, chosen.cand.dir);
    remaining = remaining.filter((w) => w !== chosen.word);
  }

  return { entries };
}

/** ترتيب الخلايا، الترقيم، وقوائم التلميحات */
function finalize(entries) {
  if (!entries.length) return null;

  // احسب الحدود
  let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
  const expanded = entries.map((e) => {
    const cells = [];
    for (let i = 0; i < e.answer.length; i++) {
      const r = e.row + (e.dir === 'down' ? i : 0);
      const c = e.col + (e.dir === 'across' ? -i : 0);
      cells.push({ r, c, letter: e.answer[i] });
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
    return { ...e, cells };
  });

  const rows = maxR - minR + 1;
  const cols = maxC - minC + 1;

  // شبكة الخلايا
  const grid = [];
  for (let r = 0; r < rows; r++) grid.push(new Array(cols).fill(null));

  for (const e of expanded) {
    for (const cell of e.cells) {
      const r = cell.r - minR;
      const c = cell.c - minC;
      if (!grid[r][c]) grid[r][c] = { letter: cell.letter, num: null, h: false, v: false };
      grid[r][c][e.dir === 'across' ? 'h' : 'v'] = true;
    }
  }

  // إزاحة الإدخالات
  for (const e of expanded) {
    e.row -= minR;
    e.col -= minC;
    e.cells = e.cells.map((c) => ({ r: c.r - minR, c: c.c - minC, letter: c.letter }));
  }

  // الترقيم: صفوف من الأعلى، وداخل الصف من اليمين إلى اليسار
  let counter = 0;
  const startMap = new Map();
  for (const e of expanded) startMap.set(e.row + ',' + e.col, true);

  for (let r = 0; r < rows; r++) {
    for (let c = cols - 1; c >= 0; c--) {
      if (!grid[r][c]) continue;
      if (startMap.has(r + ',' + c)) {
        counter++;
        grid[r][c].num = counter;
        for (const e of expanded) {
          if (e.row === r && e.col === c) e.num = counter;
        }
      }
    }
  }

  const across = expanded.filter((e) => e.dir === 'across').sort((a, b) => a.num - b.num);
  const down = expanded.filter((e) => e.dir === 'down').sort((a, b) => a.num - b.num);

  return {
    rows,
    cols,
    grid,
    entries: expanded.map((e) => ({ num: e.num, dir: e.dir, row: e.row, col: e.col, answer: e.answer, clue: e.clue, cells: e.cells })),
    across,
    down,
    wordCount: expanded.length,
  };
}

/**
 * توليد أحجية كاملة
 * @param {Array} words [{answer, clue}]
 * @param {string|number} seed بذرة حتمية
 * @param {number} target عدد الكلمات المستهدف
 */
function generatePuzzle(words, seed, target = 13) {
  const base = typeof seed === 'number' ? seed : hashString(String(seed));
  // استبعاد الكلمات القصيرة جدًا (أقل من 3 حروف) لأنها تُربك الشبكة
  const usable = words
    .map((w) => ({ answer: String(w.answer || w[0]).replace(/\s+/g, ''), clue: w.clue || w[1] }))
    .filter((w) => normalizeArabic(w.answer).length >= 3);
  let best = null;

  for (let attempt = 0; attempt < 18; attempt++) {
    const rnd = mulberry32((base + attempt * 7919) >>> 0);
    const pool = shuffle(usable.map((w) => ({ ...w })), rnd);
    const result = finalize(buildOnce(pool, rnd, target).entries);
    if (result) {
      const area = result.rows * result.cols;
      const bestArea = best ? best.rows * best.cols : Infinity;
      if (!best || result.wordCount > best.wordCount || (result.wordCount === best.wordCount && area < bestArea)) {
        best = result;
      }
    }
    // نتوقف عند شبكة جيدة ومتراصّة
    if (best && best.wordCount >= Math.min(12, usable.length) && Math.max(best.rows, best.cols) <= 14) break;
  }

  return best;
}

}
function curWordCells() {
  const e = currentEntry();
  return new Set(e.cells.map((x) => cellKey(x.r, x.c)));
}

function gameHTML() {
  const p = game.puzzle;
  const cur = currentEntry();
  const wordCells = curWordCells();
  const selKey = game.sel ? cellKey(game.sel.r, game.sel.c) : '';
  const elapsed = game.done ? game.elapsed : Date.now() - game.start;

  let cells = '';
  for (let r = 0; r < p.rows; r++) {
    for (let c = 0; c < p.cols; c++) {
      const cell = p.grid[r][c];
      if (!cell) { cells += '<div class="cell blank"></div>'; continue; }
      const k = cellKey(r, c);
      const letter = game.letters[k] || '';
      const cls = [
        'cell',
        letter ? 'filled' : '',
        wordCells.has(k) ? 'in-word' : '',
        k === selKey ? 'active' : '',
        game.wrong.has(k) ? 'wrong' : '',
        game.revealed.has(k) && letter ? 'revealed' : '',
      ].filter(Boolean).join(' ');
      cells += `<div class="${cls}" data-r="${r}" data-c="${c}">${cell.num ? `<span class="n">${cell.num}</span>` : ''}${esc(letter)}</div>`;
    }
  }

  return `
    <div class="game-head">
      <button class="icon-btn" id="backBtn">→</button>
      <div class="crumb"><b>${esc(game.cat.name)}</b> · صفحة ${game.level}<br>
        <span id="timer">⏱ ${fmtTime(elapsed)}</span> · ⭐ ${DB.points} نقطة</div>
      <button class="icon-btn" id="restartBtn" title="إعادة">↺</button>
    </div>

    <div class="clue">
      <div class="clue-badge">${cur.num}<br>${cur.dir === 'across' ? 'أفقي' : 'عمودي'}</div>
      <div class="clue-text">${esc(cur.clue)} <span style="color:var(--soft);font-size:12px">(${cur.answer.length} حروف)</span></div>
      <div class="clue-nav">
        <button id="prevClue" title="السابق">‹</button>
        <button id="nextClue" title="التالي">›</button>
      </div>
    </div>

    <div class="grid-wrap"><div class="grid" id="grid" style="grid-template-columns:repeat(${p.cols}, var(--cell))">${cells}</div></div>

    <div class="tools">
      <button class="tool" id="toolLetter"><span class="ico">💡</span>كشف حرف<br><span class="cost">${COSTS.letter} نقاط</span></button>
      <button class="tool" id="toolWord"><span class="ico">🔍</span>كشف كلمة<br><span class="cost">${COSTS.word} نقطة</span></button>
      <button class="tool" id="toolCheck"><span class="ico">🎯</span>تحقق<br><span class="cost">${COSTS.check} نقاط</span></button>
    </div>

    <div class="kb" id="kb">
      ${['ابتثجحخدذرز', 'سشصضطظعغفقك', 'لمنهوي'].map((row) =>
        `<div class="kb-row">${row.split('').map((ch) => `<button class="key" data-key="${ch}">${ch}</button>`).join('')}
         ${row === 'لمنهوي' ? '<button class="key wide" data-key="__del">⌫ حذف</button>' : ''}</div>`
      ).join('')}
      <div class="kb-row">
        ${['أ', 'إ', 'آ', 'ة', 'ى', 'ؤ', 'ئ', 'ء'].map((ch) => `<button class="key alt" data-key="${ch}">${ch}</button>`).join('')}
      </div>
    </div>
  `;
}

function fitGrid() {
  const wrap = document.querySelector('.grid-wrap');
  if (!wrap || !game) return;
  const p = game.puzzle;
  const avail = wrap.clientWidth - 14;
  const size = Math.max(19, Math.min(40, Math.floor((avail - (p.cols + 1) * 2) / p.cols)));
  document.documentElement.style.setProperty('--cell', size + 'px');
}

/* ---------- المؤقّت ---------- */
function startTimer() {
  stopTimer();
  if (!game || game.done) return;
  timerId = setInterval(() => {
    const el = $('#timer');
    if (el && game && !game.done) el.textContent = '⏱ ' + fmtTime(Date.now() - game.start);
  }, 1000);
}
function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
}

/* ==================== بدء اللعب ==================== */
function startGame(catId, level) {
  const cat = CATEGORIES.find((c) => c.id === catId);
  const puzzle = generatePuzzle(cat.words, catId + '-' + level, 13);
  if (!puzzle) { toast('تعذّر توليد الأحجية، جرّب صفحة أخرى'); return; }

  const saved = DB.puzzles[pkey(catId, level)];
  game = {
    cat, level, puzzle,
    letters: {},
    revealed: new Set(),
    wrong: new Set(),
    sel: { r: puzzle.entries[0].row, c: puzzle.entries[0].col },
    dir: puzzle.entries[0].dir,
    helps: 0,
    start: Date.now(),
    elapsed: 0,
    done: false,
    replay: !!(saved && saved.solved),
  };
  view = { screen: 'game', catId };
  render();
}

/* ---------- التحديد والإدخال ---------- */
function selectCell(r, c) {
  if (!game || game.done) return;
  const list = entriesAt(r, c);
  if (!list.length) return;
  const same = game.sel && game.sel.r === r && game.sel.c === c;
  if (same && list.length > 1) {
    game.dir = game.dir === 'across' ? 'down' : 'across';
  } else {
    game.sel = { r, c };
    if (!list.some((e) => e.dir === game.dir)) game.dir = list[0].dir;
  }
  render();
}

function typeLetter(ch) {
  if (!game || game.done || !game.sel) return;
  const k = cellKey(game.sel.r, game.sel.c);
  if (!cellAt(game.sel.r, game.sel.c)) return;
  game.letters[k] = ch;
  game.wrong.delete(k);
  game.revealed.delete(k);
  advance();
  sfx.type();
  render();
  checkComplete();
}

function advance() {
  const e = currentEntry();
  const idx = e.cells.findIndex((x) => x.r === game.sel.r && x.c === game.sel.c);
  if (idx >= 0 && idx < e.cells.length - 1) {
    game.sel = { r: e.cells[idx + 1].r, c: e.cells[idx + 1].c };
  }
}

function backspace() {
  if (!game || game.done || !game.sel) return;
  const k = cellKey(game.sel.r, game.sel.c);
  if (game.letters[k]) {
    delete game.letters[k];
    game.revealed.delete(k);
  } else {
    const e = currentEntry();
    const idx = e.cells.findIndex((x) => x.r === game.sel.r && x.c === game.sel.c);
    if (idx > 0) {
      const prev = e.cells[idx - 1];
      game.sel = { r: prev.r, c: prev.c };
      delete game.letters[cellKey(prev.r, prev.c)];
    }
  }
  render();
}

function cycleClue(step) {
  const list = game.puzzle.entries;
  let i = list.indexOf(currentEntry());
  i = (i + step + list.length) % list.length;
  const e = list[i];
  game.sel = { r: e.row, c: e.col };
  game.dir = e.dir;
  render();
}

/* ---------- التحقق والإكمال ---------- */
function checkComplete() {
  const p = game.puzzle;
  let filled = 0, total = 0;
  let allRight = true;
  game.wrong.clear();

  for (let r = 0; r < p.rows; r++) {
    for (let c = 0; c < p.cols; c++) {
      const cell = p.grid[r][c];
      if (!cell) continue;
      total++;
      const k = cellKey(r, c);
      const typed = game.letters[k];
      if (!typed) { allRight = false; continue; }
      filled++;
      if (normalizeArabic(typed) !== normalizeArabic(cell.letter)) {
        allRight = false;
        game.wrong.add(k);
      }
    }
  }

  if (filled < total) return;

  if (allRight) {
    win();
  } else {
    sfx.err();
    render();
    const grid = $('#grid');
    if (grid) { grid.classList.add('shake'); setTimeout(() => grid.classList.remove('shake'), 320); }
    toast('بعض الحروف غير صحيحة — صحّحها أو استخدم «تحقق»');
    setTimeout(() => {
      if (game && !game.done) { game.wrong.clear(); render(); }
    }, 2500);
  }
}

function win() {
  game.done = true;
  game.elapsed = Date.now() - game.start;
  stopTimer();

  // املأ الحروف بالشكل الصحيح
  const p = game.puzzle;
  for (let r = 0; r < p.rows; r++) {
    for (let c = 0; c < p.cols; c++) {
      const cell = p.grid[r][c];
      if (cell) game.letters[cellKey(r, c)] = cell.letter;
    }
  }

  const stars = game.helps === 0 ? 3 : game.helps <= 2 ? 2 : 1;
  const prev = DB.puzzles[pkey(game.cat.id, game.level)];
  let reward;
  if (game.replay) reward = REWARD.repeat;
  else reward = REWARD.base + (game.helps === 0 ? REWARD.noHelp : 0) + (game.elapsed < 180000 ? REWARD.fast : 0);

  DB.points += reward;
  DB.puzzles[pkey(game.cat.id, game.level)] = {
    solved: true,
    stars: Math.max(stars, (prev && prev.stars) || 0),
    helps: game.helps,
    ms: game.elapsed,
  };
  saveDB();
  sfx.win();
  render();
  showWinModal({ stars, reward, ms: game.elapsed });
}

function showWinModal({ stars, reward, ms }) {
  const nextLevel = game.level < LEVELS_PER_CATEGORY ? game.level + 1 : null;
  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <div class="big">🎉</div>
      <h2>أحسنت! حلّيت الصفحة</h2>
      <div class="stars-row">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
      <p>الوقت: ${fmtTime(ms)} · المساعدات: ${game.helps}</p>
      <div class="reward">+ <b>${reward}</b> نقطة</div>
      <div class="modal-actions">
        ${nextLevel ? `<button class="btn primary" data-act="next">الصفحة التالية ←</button>` : ''}
        <button class="btn soft" data-act="levels">كل الصفحات</button>
        <button class="btn soft" data-act="home">الرئيسية</button>
      </div>
    </div>`;
  backdrop.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (!act && e.target !== backdrop) return;
    const a = act ? act.dataset.act : 'levels';
    backdrop.remove();
    if (a === 'next' && nextLevel) startGame(game.cat.id, nextLevel);
    else if (a === 'home') { view = { screen: 'home', catId: null }; render(); }
    else { view = { screen: 'category', catId: game.cat.id }; game = null; render(); }
  });
  document.body.appendChild(backdrop);
}

/* ---------- الأدوات المساعدة ---------- */
function spend(cost) {
  if (DB.points < cost) {
    toast('نقاطك لا تكفي — أكمل أحجية لكسب المزيد');
    return false;
  }
  DB.points -= cost;
  saveDB();
  return true;
}

function toolLetter() {
  if (!game || game.done || !game.sel) return;
  const { r, c } = game.sel;
  const cell = cellAt(r, c);
  if (!cell) return;
  const k = cellKey(r, c);
  if (game.letters[k] === cell.letter) return toast('هذا الحرف صحيح بالفعل');
  if (!spend(COSTS.letter)) return;
  game.letters[k] = cell.letter;
  game.revealed.add(k);
  game.helps++;
  game.wrong.delete(k);
  sfx.tool();
  advance();
  render();
  checkComplete();
}

function toolWord() {
  if (!game || game.done) return;
  const e = currentEntry();
  const missing = e.cells.filter((x) => game.letters[cellKey(x.r, x.c)] !== x.letter);
  if (!missing.length) return toast('الكلمة مكتملة بالفعل');
  if (!spend(COSTS.word)) return;
  for (const x of e.cells) {
    const k = cellKey(x.r, x.c);
    game.letters[k] = e.answer[e.cells.indexOf(x)];
    game.revealed.add(k);
  }
  game.helps++;
  sfx.tool();
  render();
  checkComplete();
}

function toolCheck() {
  if (!game || game.done) return;
  if (!spend(COSTS.check)) return;
  let wrongCount = 0;
  const p = game.puzzle;
  for (let r = 0; r < p.rows; r++) {
    for (let c = 0; c < p.cols; c++) {
      const cell = p.grid[r][c];
      if (!cell) continue;
      const k = cellKey(r, c);
      const typed = game.letters[k];
      if (typed && normalizeArabic(typed) !== normalizeArabic(cell.letter)) {
        game.wrong.add(k);
        wrongCount++;
      }
    }
  }
  game.helps++;
  sfx.tool();
  render();
  toast(wrongCount ? `يوجد ${wrongCount} حرفًا خاطئًا (معلّمة بالأحمر)` : 'كل الحروف المدخلة صحيحة ✅');
  setTimeout(() => {
    if (game && !game.done) { game.wrong.clear(); render(); }
  }, 2600);
}

/* ==================== ربط الأحداث ==================== */
function bindScreen() {
  const soundBtn = $('#soundBtn');
  if (soundBtn) soundBtn.addEventListener('click', () => { DB.sound = !DB.sound; saveDB(); render(); });
  const themeBtn = $('#themeBtn');
  if (themeBtn) themeBtn.addEventListener('click', () => { DB.theme = DB.theme === 'dark' ? 'light' : 'dark'; saveDB(); render(); });

  const backBtn = $('#backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', () => {
      if (view.screen === 'game') { game = null; view = { screen: 'category', catId: view.catId }; }
      else view = { screen: 'home', catId: null };
      render();
    });
  }

  document.querySelectorAll('[data-cat]').forEach((el) => {
    el.addEventListener('click', () => { view = { screen: 'category', catId: el.dataset.cat }; render(); });
  });

  document.querySelectorAll('[data-level]').forEach((el) => {
    el.addEventListener('click', () => startGame(view.catId, Number(el.dataset.level)));
  });

  const bonusBtn = $('#bonusBtn');
  if (bonusBtn) {
    bonusBtn.addEventListener('click', () => {
      if (!bonusAvailable()) return;
      DB.points += 25;
      DB.lastBonus = todayKey();
      saveDB();
      sfx.tool();
      render();
      toast('حصلت على 25 نقطة 🎁');
    });
  }

  const randomBtn = $('#randomBtn');
  if (randomBtn) {
    randomBtn.addEventListener('click', () => {
      const unsolved = [];
      for (const cat of CATEGORIES) {
        for (let lv = 1; lv <= LEVELS_PER_CATEGORY; lv++) {
          const rec = DB.puzzles[pkey(cat.id, lv)];
          if (!rec || !rec.solved) unsolved.push({ catId: cat.id, lv });
        }
      }
      const pickItem = unsolved.length
        ? unsolved[Math.floor(Math.random() * unsolved.length)]
        : { catId: CATEGORIES[Math.floor(Math.random() * CATEGORIES.length)].id, lv: 1 + Math.floor(Math.random() * LEVELS_PER_CATEGORY) };
      startGame(pickItem.catId, pickItem.lv);
    });
  }

  const restartBtn = $('#restartBtn');
  if (restartBtn) {
    restartBtn.addEventListener('click', () => {
      if (!game) return;
      const { cat, level } = game;
      startGame(cat.id, level);
    });
  }

  const grid = $('#grid');
  if (grid) {
    grid.addEventListener('click', (e) => {
      const cell = e.target.closest('.cell');
      if (!cell || cell.classList.contains('blank')) return;
      selectCell(Number(cell.dataset.r), Number(cell.dataset.c));
    });
  }

  const kb = $('#kb');
  if (kb) {
    kb.addEventListener('click', (e) => {
      const key = e.target.closest('[data-key]');
      if (!key) return;
      if (key.dataset.key === '__del') backspace();
      else typeLetter(key.dataset.key);
    });
  }

  const prev = $('#prevClue'); if (prev) prev.addEventListener('click', () => cycleClue(-1));
  const next = $('#nextClue'); if (next) next.addEventListener('click', () => cycleClue(1));
  const tl = $('#toolLetter'); if (tl) tl.addEventListener('click', toolLetter);
  const tw = $('#toolWord'); if (tw) tw.addEventListener('click', toolWord);
  const tc = $('#toolCheck'); if (tc) tc.addEventListener('click', toolCheck);
}

/* ---------- لوحة المفاتيح الحقيقية ---------- */
const AR_LETTERS = 'ابتثجحخدذرزسشصضطظعغفقكلمنهويأإآةىؤئء';
document.addEventListener('keydown', (e) => {
  if (!game || game.done) return;
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const d = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0] }[e.key];
    let r = game.sel.r + d[0], c = game.sel.c + d[1];
    while (r >= 0 && c >= 0 && r < game.puzzle.rows && c < game.puzzle.cols && !cellAt(r, c)) {
      r += d[0]; c += d[1];
    }
    if (cellAt(r, c)) selectCell(r, c);
    return;
  }
  if (e.key.length === 1 && AR_LETTERS.includes(e.key)) {
    e.preventDefault();
    typeLetter(e.key);
  }
});

window.addEventListener('resize', fitGrid);

/* ---------- واجهة للاختبار الآلي (لا تؤثر على المستخدم) ---------- */
try {
  window.ShabakaApp = {
    get state() { return { game, view, DB, CATEGORIES, COSTS, TOTAL_PUZZLES }; },
    startGame, selectCell, typeLetter, backspace, toolLetter, toolWord, toolCheck, cycleClue,
    normalizeArabic,
  };
} catch { /* ignore */ }

/* ---------- انطلاق ---------- */
render();

</script>
